services:
  - type: web
    name: gymfit-api
    runtime: node
    plan: free
    buildCommand: "npm install && npx prisma generate && npm run build"
    startCommand: "node dist/index.js"
    envVars:
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: NODE_ENV
        value: "production"
      - key: FRONTEND_URL
        sync: false
